# System Settings - Panzer Project

language: ja
log_level: info
worktree_base: worktrees/

communication:
  polling_disabled: true       # ポーリング（待機ループ）禁止
  method: post_script          # 通知方式（post_script使用）
  post_script_path: scripts/post.sh  # post.shスクリプトのパス

model_override:
  hq:
    miho: opus
    maho: opus
  platoon1:
    default: sonnet
  platoon2:
    default: sonnet
  platoon3:
    default: sonnet

active_agent_limit: 8

# リソース制御設定
resource_control:
  # 中隊あたりの同時稼働最大数
  max_active_units_per_platoon: 2
  # 待機中の隊員の状態
  standby_behavior: idle
  # リソース超過時の動作（queue: キューに入れて待機）
  on_limit_exceeded: queue
